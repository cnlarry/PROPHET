  # 18. 希尔伯特变换
  - id: "HT"
    name: "希尔伯特变换"
    category: "advanced"
    description: "信号处理技术，分析时间序列的周期性、相位和趋势"
    syntax: "HT(timeframe).field[.subfield]"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
    fields:
      - name: "DCPERIOD"
        type: "double"
        description: "主导周期"
        readonly: true
      - name: "DCPHASE"
        type: "double"
        description: "主导周期相位"
        readonly: true
      - name: "PHASOR"
        type: "object"
        description: "相量分量（需访问子字段）"
        readonly: true
        subfields:
          - name: "inphase"
            type: "double"
            description: "同相分量"
          - name: "quadrature"
            type: "double"
            description: "正交分量"
      - name: "SINE"
        type: "object"
        description: "正弦波（需访问子字段）"
        readonly: true
        subfields:
          - name: "sine"
            type: "double"
            description: "主正弦波"
          - name: "leadsine"
            type: "double"
            description: "领先正弦波"
      - name: "TRENDMODE"
        type: "integer"
        description: "趋势模式（0=无趋势，1=有趋势）"
        readonly: true
      - name: "TRENDLINE"
        type: "double"
        description: "趋势线值"
        readonly: true
    examples:
      - "HT(5m).DCPERIOD"
      - "HT(5m).DCPHASE"
      - "HT(5m).PHASOR.inphase"
      - "HT(5m).SINE.sine"
      - "HT(5m).TRENDMODE"
      - "HT(5m).TRENDLINE"

