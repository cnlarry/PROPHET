  # 10. 变化量计算
  - id: "CHANGE"
    name: "变化量计算"
    category: "statistics"
    description: "计算当前值与N个周期前的变化量"
    syntax: "CHANGE(timeframe).method(PERIOD).subfield"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
    methods:
      - name: "open"
        return_type: "object"
