          - name: "pct"
            type: "double"
            description: "百分位排名（0.0到1.0）"
      - name: "volume"
        return_type: "object"
        parameters:
          - name: "period"
            type: "integer"
            required: true
            min: 1
            max: 100
        subfields:
          - name: "value"
            type: "integer"
            description: "绝对排名（1到period）"
          - name: "pct"
            type: "double"
            description: "百分位排名（0.0到1.0）"
    examples:
