  # 23. 公平价值缺口
  - id: "FVG"
    name: "公平价值缺口"
    category: "smc"
    description: "Fair Value Gap 检测与分析"
    syntax: "FVG(timeframe).method(params) 或 FVG(timeframe).field[.subfield]"
    parameters:
      - name: "timeframe"
        type: "timeframe"
        required: true
    methods:
      - name: "bullish"
        return_type: "boolean"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
            min: 0
            max: 500
            description: "回溯周期，0表示当前K线"
          - name: "min_gap_pct"
            type: "double"
            default: 0.0
            min: 0.0
            max: 100.0
            description: "最小缺口百分比过滤"
        description: "检测是否存在看涨FVG"
      - name: "bearish"
        return_type: "boolean"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
            min: 0
            max: 500
          - name: "min_gap_pct"
            type: "double"
            default: 0.0
            min: 0.0
            max: 100.0
        description: "检测是否存在看跌FVG"
      - name: "any"
        return_type: "boolean"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
            min: 0
            max: 500
          - name: "min_gap_pct"
            type: "double"
            default: 0.0
            min: 0.0
            max: 100.0
        description: "检测是否存在任意类型的FVG"
    fields:
      - name: "top"
        type: "double"
        description: "FVG上边界价格"
        readonly: true
      - name: "bottom"
        type: "double"
        description: "FVG下边界价格"
        readonly: true
      - name: "mid"
        type: "double"
        description: "FVG中点价格 (top + bottom) / 2"
        readonly: true
      - name: "size"
        type: "double"
        description: "FVG大小 (top - bottom)"
        readonly: true
      - name: "isfilled"
        type: "boolean"
        description: "是否已完全填补（100%）"
        readonly: true
      - name: "filled_pct"
        type: "double"
        description: "填补百分比（0-100）"
        readonly: true
      - name: "filled"
        type: "object"
        description: "填补详细信息（访问子字段）"
        readonly: true
        subfields:
          - name: "ispartial"
            type: "boolean"
            description: "是否部分填补（0% < filled_pct < 100%）"
          - name: "pct"
            type: "double"
            description: "填补百分比（同filled_pct，保持兼容）"
      - name: "remaining"
        type: "object"
        description: "剩余未填补区域信息（访问子字段）"
        readonly: true
        subfields:
          - name: "top"
            type: "double"
            description: "剩余区域上边界（C++实现）"
          - name: "bottom"
            type: "double"
            description: "剩余区域下边界（C++实现）"
          - name: "mid"
            type: "double"
            description: "剩余区域中点（C++派生字段）"
          - name: "size"
            type: "double"
            description: "剩余区域大小（C++派生字段）"
    examples:
      - "FVG(5m).bullish(0, 0.1)  // 检测当前是否有看涨FVG（最小0.1%缺口）"
      - "FVG(15m).any(5, 0.0)  // 检测5根K线前是否有任意FVG"
      - "FVG(5m).top  // FVG上边界"
      - "FVG(5m).mid  // FVG中点"
      - "FVG(5m).size  // FVG大小"
      - "FVG(5m).isfilled  // 是否已完全填补"
      - "FVG(5m).filled_pct  // 填补百分比"
      - "FVG(5m).filled.ispartial  // 是否部分填补"
      - "FVG(5m).filled.pct  // 填补百分比（另一种访问方式）"
      - "FVG(5m).remaining.top  // 剩余区域上边界"
      - "FVG(5m).remaining.bottom  // 剩余区域下边界"
      - "FVG(5m).remaining.mid  // 剩余区域中点"
      - "FVG(5m).remaining.size  // 剩余区域大小"

  # 24. 溢价/折价区分析
  - id: "PREMIUM"
    name: "溢价/折价区分析"
    category: "smc"
    description: "分析当前价格在某个范围内的位置"
    syntax: "PREMIUM(timeframe).method(PERIOD)"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
    methods:
      - name: "premium"
        return_type: "boolean"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "是否在溢价区"
      - name: "discount"
        return_type: "boolean"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "是否在折价区"
      - name: "equilibrium"
        return_type: "boolean"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "是否在均衡区"
      - name: "zone"
        return_type: "integer"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "区域类型（1=溢价，0=均衡，-1=折价）"
      - name: "pct"
        return_type: "double"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "在范围内的百分比位置"
      - name: "level"
        return_type: "double"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "均衡价格水平"
      - name: "strength"
        return_type: "double"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "区域强度"
      - name: "high"
        return_type: "double"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "范围高点"
      - name: "low"
        return_type: "double"
        parameters:
          - name: "period"
            type: "integer"
            default: 100
            min: 1
            max: 100
        description: "范围低点"
    examples:
      - "PREMIUM(5m).discount(100)"
      - "PREMIUM(15m).premium(100)"
      - "PREMIUM(5m).pct(100)"

