# =============================================================================
# 时间序列函数定义
# 语法: FUNCTION().method(params)
# 特点: 不需要timeframe参数，数据自带时间维度
# 用于处理历史数据序列（如恐惧与贪婪指数、资金费率等）
# =============================================================================
timeseries_functions:
  
  # 1. FEARGREED - 恐惧与贪婪指数
  - id: "FEARGREED"
    name: "恐惧与贪婪指数"
    category: "sentiment"
    description: "Alternative.me 加密货币恐惧与贪婪指数，用于衡量市场情绪(0-100)"
    syntax: "FEARGREED().method(params)"
    rating: 4
    data_source: "Alternative.me API + feargreed数据表"
    update_frequency: "每日更新"
    parameters: []
    methods:
      # 基础访问方法
      - name: "value"
        return_type: "integer"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移天数，0=今天，1=昨天，7=7天前"
        description: "获取指定日期的恐惧与贪婪指数值(0-100)"
      
      - name: "classification"
        return_type: "string"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移天数，0=今天，1=昨天，7=7天前"
        description: "获取指定日期的分类标签(Extreme Fear/Fear/Neutral/Greed/Extreme Greed)"
      
      # 变化量方法
      - name: "change"
        return_type: "integer"
        parameters:
          - name: "period"
            type: "integer"
            default: 7
            min: 1
            max: 100
            description: "计算变化的周期(天)"
        description: "计算N天变化量 (当前值 - N天前)"
      
      # 平均值方法
      - name: "avg"
        return_type: "double"
        parameters:
          - name: "period"
            type: "integer"
            default: 7
            min: 1
            max: 100
            description: "计算平均值的周期(天)"
        description: "计算N天平均值"
      
      # 最小值方法
      - name: "min"
        return_type: "integer"
        parameters:
          - name: "period"
            type: "integer"
            default: 7
            min: 1
            max: 100
            description: "查找最小值的周期(天)"
        description: "获取N天内的最小值"
      
      # 最大值方法
      - name: "max"
        return_type: "integer"
        parameters:
          - name: "period"
            type: "integer"
            default: 7
            min: 1
            max: 100
            description: "查找最大值的周期(天)"
        description: "获取N天内的最大值"
      
      # 趋势判断方法
      - name: "trend"
        return_type: "enum"
        parameters:
          - name: "period"
            type: "integer"
            default: 7
            min: 2
            max: 100
            description: "判断趋势的周期(天)"
        description: "判断N天趋势方向：RISING(上升)/FALLING(下降)/STABLE(稳定)"
    
    examples:
      - "FEARGREED().value(0) < 25  // 当前极度恐慌"
      - "FEARGREED().classification(0) = \"Extreme Fear\"  // 获取分类标签"
      - "FEARGREED().change(7) < -10  // 7天下降超过10点"
      - "FEARGREED().avg(30) < 40  // 30天平均值较低"
      - "FEARGREED().trend(7) = FALLING  // 7天趋势下降"
      - "FEARGREED().value(0) > FEARGREED().avg(7)  // 当前高于7天均值"

  # 2. FUNDINGRATE - 资金费率（待实现）
  - id: "FUNDINGRATE"
    name: "资金费率"
    category: "market"
    description: "期货合约资金费率历史数据，用于判断多空力量对比"
    syntax: "FUNDINGRATE().method(params)"
    rating: 4
    data_source: "Binance API + fundingrate数据表"
    update_frequency: "每8小时更新"
    parameters: []
    methods:
      - name: "value"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移次数，0=最新，1=上一次"
        description: "获取指定时间的资金费率"
      
      - name: "avg"
        return_type: "double"
        parameters:
          - name: "period"
            type: "integer"
            default: 24
            min: 1
            max: 100
            description: "计算平均值的周期(次)"
        description: "计算N次平均资金费率"
      
      - name: "trend"
        return_type: "enum"
        parameters:
          - name: "period"
            type: "integer"
            default: 24
            min: 2
            max: 100
            description: "判断趋势的周期(次)"
        description: "判断资金费率趋势：RISING/FALLING/STABLE"
    
    examples:
      - "FUNDINGRATE().value(0) > 0.001  // 资金费率较高"
      - "FUNDINGRATE().avg(24) < 0  // 24次平均为负"
      - "FUNDINGRATE().trend(24) = RISING  // 持续上升趋势"

  # 3. CURRENT - 当前状态访问函数
  - id: "CURRENT"
    name: "当前状态"
    category: "runtime"
    description: "访问当前价格、时间和市场数据"
    syntax: "CURRENT().field"
    rating: 5
    data_source: "运行时传入"
    update_frequency: "实时"
    parameters: []
    methods:
      # 价格
      - name: "price"
        return_type: "double"
        parameters: []
        description: "当前价格"
      
      # 时间戳
      - name: "timestamp"
        return_type: "integer"
        parameters: []
        description: "当前Unix时间戳（秒）"
      
      # 资金费率
      - name: "fundingrate"
        return_type: "double"
        parameters: []
        description: "当前资金费率"
    
    # 时间字段（属性访问）
    time_fields:
      - name: "time.hour"
        return_type: "integer"
        description: "UTC时间小时（0-23）"
      
      - name: "time.minute"
        return_type: "integer"
        description: "UTC时间分钟（0-59）"
      
      - name: "time.second"
        return_type: "integer"
        description: "UTC时间秒（0-59）"
      
      - name: "time.week"
        return_type: "integer"
        description: "UTC时间星期几（0-6，0=周日）"
      
      - name: "time.day"
        return_type: "integer"
        description: "UTC时间日期（1-31）"
      
      - name: "time.month"
        return_type: "integer"
        description: "UTC时间月份（1-12）"
    
    # 带时区的时间字段（方法调用）
    time_methods:
      - name: "time(timezone).hour"
        return_type: "integer"
        parameters:
          - name: "timezone"
            type: "integer"
            default: 0
            min: -12
            max: 12
            description: "UTC偏移量，如8表示北京时间"
        description: "指定时区的小时（0-23）"
      
      - name: "time(timezone).minute"
        return_type: "integer"
        parameters:
          - name: "timezone"
            type: "integer"
            default: 0
            min: -12
            max: 12
        description: "指定时区的分钟（0-59）"
      
      - name: "time(timezone).second"
        return_type: "integer"
        parameters:
          - name: "timezone"
            type: "integer"
            default: 0
            min: -12
            max: 12
        description: "指定时区的秒（0-59）"
      
      - name: "time(timezone).week"
        return_type: "integer"
        parameters:
          - name: "timezone"
            type: "integer"
            default: 0
            min: -12
            max: 12
        description: "指定时区的星期几（0-6，0=周日）"
      
      - name: "time(timezone).day"
        return_type: "integer"
        parameters:
          - name: "timezone"
            type: "integer"
            default: 0
            min: -12
            max: 12
        description: "指定时区的日期（1-31）"
      
      - name: "time(timezone).month"
        return_type: "integer"
        parameters:
          - name: "timezone"
            type: "integer"
            default: 0
            min: -12
            max: 12
        description: "指定时区的月份（1-12）"
    
    # 恐惧贪婪指数字段
    feargreed_fields:
      - name: "feargreed.value"
        return_type: "integer"
        description: "当天的恐惧贪婪指数值（0-100）"
      
      - name: "feargreed.classification"
        return_type: "enum"
        description: "当天的分类标签（Neutral/Greed/Fear/Extreme Greed/Extreme Fear）"
      
      - name: "feargreed(offset).value"
        return_type: "integer"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移天数（负数表示过去，0=今天，-1=昨天）"
        description: "指定日期的恐惧贪婪指数值"
    
    # 多空比字段（子函数组）
    longshort_fields:
      - name: "longshort.ratio"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移次数（负数表示过去，0=当前，-1=上一次）"
        description: "多空比率（long/short）"
      
      - name: "longshort.long"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移次数（负数表示过去，0=当前，-1=上一次）"
        description: "多头比例（0~1）"
      
      - name: "longshort.short"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移次数（负数表示过去，0=当前，-1=上一次）"
        description: "空头比例（0~1）"
      
      - name: "longshort.net"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移次数（负数表示过去，0=当前，-1=上一次）"
        description: "净多头比例（(long-short)/(long+short)）"
      
      - name: "longshort.dominance"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移次数（负数表示过去，0=当前，-1=上一次）"
        description: "多头主导率（long/(long+short)*100）"
      
      - name: "longshort.trend"
        return_type: "enum"
        parameters:
          - name: "period"
            type: "integer"
            default: 7
            min: 2
            max: 100
            description: "判断趋势的周期（数据点数量）"
        description: "判断多空比趋势：RISING/FALLING/STABLE"
      
      - name: "longshort.extreme"
        return_type: "boolean"
        parameters:
          - name: "threshold"
            type: "double"
            default: 2.0
            min: 0.1
            max: 10.0
            description: "极端阈值（ratio > threshold 或 < 1/threshold）"
        description: "判断是否极端（多空比过高或过低）"
    
    examples:
      - "CURRENT().price > $(1h).EMA().value  // 价格突破均线"
      - "CURRENT().time.hour BETWEEN(9, 21)  // UTC时间9-21点"
      - "CURRENT().time(8).hour BETWEEN(9, 21)  // 北京时间9-21点"
      - "CURRENT().time.week BETWEEN(1, 5)  // 工作日（周一到周五）"
      - "CURRENT().fundingrate < 0.001  // 资金费率较低"
      - "CURRENT().feargreed.value < 25  // 极度恐慌"
      - "CURRENT().feargreed(-1).value > 50  // 昨天贪婪"
      - "CURRENT().longshort.ratio(0) > 1.5  // 多空比大于1.5"
      - "CURRENT().longshort.long(0) > 0.6  // 多头比例超过60%"
      - "CURRENT().longshort.dominance(0) > 70  // 多头主导率超过70%"
      - "CURRENT().longshort.trend(7) = RISING  // 7个数据点趋势上升"
      - "CURRENT().longshort.extreme(2.0) = true  // 多空比极端（>2.0或<0.5）"

# =============================================================================
# 自定义函数语法定义
# 说明：用户可以在 DSL 中定义自己的函数来封装复杂逻辑
# =============================================================================
custom_functions:
  # 语法规则
  syntax:
    # 函数定义格式：funcName(param1: Type, param2: Type): ReturnType { ... }
    definition_pattern: "^[a-z][a-zA-Z0-9_]*\\s*\\([^)]*\\)\\s*(:\\s*\\w+)?\\s*\\{$"
    # 函数调用格式：funcName(arg1, arg2)
    call_pattern: "\\b[a-z][a-zA-Z0-9_]*\\s*\\([^)]*\\)"
    
  # 命名规则
  naming:
    # 函数名：小写字母开头，后跟字母、数字、下划线
    function_name_pattern: "^[a-z][a-zA-Z0-9_]*$"
    description: "函数名必须以小写字母开头，可包含字母、数字、下划线"
    examples: ["calcTrendScore", "getStopLoss", "my_function"]
    
  # 参数规则
  parameters:
    # 参数格式：paramName: Type
    pattern: "^[a-z][a-zA-Z0-9_]*\\s*:\\s*(Double|Integer|Boolean|String)$"
    # 支持的参数类型
    allowed_types: ["Double", "Integer", "Boolean", "String"]
    # 参数命名：小写字母开头 + 下划线
    naming_pattern: "^[a-z][a-z0-9_]*$"
    description: "参数名必须以小写字母开头，全小写+下划线，类型首字母大写"
    examples: ["price: Double", "PERIOD: Integer", "is_long: Boolean"]
    
  # 返回值规则
  return_type:
    # 支持的返回类型
    allowed_types: ["Double", "Integer", "Boolean", "String"]
    # 返回语句格式
    statement_pattern: "^return\\s+[^;]+;?$"
    description: "必须使用 return 语句返回值"
    
  # 局部变量规则
  local_variables:
    # 局部变量格式：@varName: Type = value;
    declaration_pattern: "^@[a-z][a-z0-9_]*\\s*:\\s*\\w+\\s*=\\s*[^;]+;?$"
    # 变量命名：@ + 小写字母开头 + 下划线
    naming_pattern: "^@[a-z][a-z0-9_]*$"
    description: "局部变量必须以 @ 开头，后跟小写字母、数字、下划线"
    examples: ["@score: Double = 0.0;", "@my_var: Integer = 10;"]
    
  # 使用规则
  usage:
    # 函数必须在使用前定义
    declare_before_use: true
    # 函数定义位置：文件顶部，信号规则之前
    definition_location: "top_level_before_rules"
    # 函数调用位置：可以在信号规则、其他自定义函数中调用
    call_location: ["signal_rules", "custom_functions", "condition_blocks"]
    
  # 示例
  examples:
    - description: "计算趋势评分函数"
      code: |
        calcTrendScore(ema_fast: Double, ema_slow: Double, adx_value: Double): Double {
            @score: Double = 0.0;
            if (ema_fast > ema_slow) {
                @score += 40.0;
            }
            return @score;
        }
    - description: "计算止损价格函数"
      code: |
        calcStopLoss(entry_price: Double, atr_value: Double, is_long: Boolean): Double {
            @stop_loss: Double = 0.0;
            if (is_long) {
                @stop_loss = entry_price - (atr_value * 2.0);
            } else {
                @stop_loss = entry_price + (atr_value * 2.0);
            }
            return @stop_loss;
        }

# =============================================================================
# 命名规范
# =============================================================================
naming_conventions:
  indicators:
    pattern: "^[A-Z][A-Z0-9_]*$"
    description: "指标名必须全大写，可包含数字和下划线"
    examples: ["MACD", "RSI", "BOLL"]
    
  fields:
    pattern: "^[a-z][a-z0-9_]*$"
    description: "字段名必须全小写，可包含数字和下划线"
    examples: ["value", "trend", "crossover_type"]
    
  parameters:
    pattern: "^[A-Z][A-Z0-9_]*$"
    description: "参数名必须全大写，可包含数字和下划线"
    examples: ["PERIOD", "FAST_PERIOD"]
    
  data_functions:
    pattern: "^[A-Z][A-Z0-9_]*$"
    description: "数据函数名必须全大写"
    examples: ["KLINE", "HIGHEST", "AVERAGE"]
    
  signal_functions:
    pattern: "^[A-Z][A-Z0-9_]*$"
    description: "信号函数名必须全大写"
    examples: ["ALL", "ANY", "WEIGHTED"]

# =============================================================================
# 验证规则
# =============================================================================
validation_rules:
  # 指标引用必须包含时间框架
  indicator_reference:
    pattern: "\\$\\([^)]+\\)\\.\\w+"
    message: "指标引用格式：$(timeframe).INDICATOR.field"
    
  # 参数只能赋值，不能读取后修改
  parameter_assignment:
    allowed_context: ["top_level"]
    forbidden_context: ["condition_block"]
    message: "参数赋值只能在顶层，不能在条件块内"
    
  # 字段只读，不能赋值
  field_readonly:
    message: "字段是只读的，不能赋值。只有参数可以修改。"
    
  # 信号函数必须赋值
  signal_assignment:
    required: true
    valid_values: ["BUY", "SELL", "HOLD"]
    message: "信号函数必须赋值为 BUY、SELL 或 HOLD"

