# Prophet DSL 统一规则定义文件
# 版本: 1.0.0
# 日期: 2025-11-18
# 说明: 此文件是 Prophet DSL 的唯一权威规则来源
#       所有的代码补全、语法校验、悬停提示、参数验证都基于此文件

# =============================================================================
# 元数据
# =============================================================================
metadata:
  version: "1.0.0"
  dsl_version: "4.2.0"
  core_version: "P3.2+"
  last_updated: "2025-11-18"
  description: "Prophet DSL 统一规则定义"

# =============================================================================
# 时间框架定义
# =============================================================================
timeframes:
  - id: "1m"
    name: "1分钟"
    description: "1分钟时间框架"
    seconds: 60
  - id: "5m"
    name: "5分钟"
    description: "5分钟时间框架"
    seconds: 300
  - id: "15m"
    name: "15分钟"
    description: "15分钟时间框架"
    seconds: 900
  - id: "30m"
    name: "30分钟"
    description: "30分钟时间框架"
    seconds: 1800
  - id: "1h"
    name: "1小时"
    description: "1小时时间框架"
    seconds: 3600
  - id: "4h"
    name: "4小时"
    description: "4小时时间框架"
    seconds: 14400
  - id: "1d"
    name: "1天"
    description: "1天时间框架"
    seconds: 86400
  - id: "1w"
    name: "1周"
    description: "1周时间框架"
    seconds: 604800

# =============================================================================
# 技术指标定义 (共62个指标)
# 语法: $(timeframe).INDICATOR().field
# 参考文档: Prophet DSL 指标.md
# =============================================================================
indicators:

  # 指标 1: MACD
  - id: "MACD"
    name: "移动平均收敛发散指标"
    category: "momentum"
    description: "Moving Average Convergence Divergence"
    syntax: "$(timeframe).MACD().field"
    rating: 5
    parameters:
      - name: "FAST_PERIOD"
        type: "integer"
        default: 12
        min: 5
        max: 50
      - name: "SLOW_PERIOD"
        type: "integer"
        default: 26
        min: 10
        max: 100
      - name: "SIGNAL_PERIOD"
        type: "integer"
        default: 9
        min: 5
        max: 30
    fields:
      - name: "macd"
        type: "double"
        description: "MACD线值"
        readonly: true
      - name: "signal"
        type: "double"
        description: "信号线值"
        readonly: true
      - name: "histogram"
        type: "double"
        description: "柱状图值"
        readonly: true
      - name: "crossover_type"
        type: "enum"
        enum_values: ["GOLDEN_CROSS", "DEATH_CROSS", "NONE"]
        description: "交叉类型"
        readonly: true
      - name: "zero_cross"
        type: "boolean"
        description: "零轴穿越"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true
      - name: "momentum"
        type: "double"
        description: "动量强度"
        readonly: true

  # 指标 2: RSI
  - id: "RSI"
    name: "相对强弱指标"
    category: "momentum"
    description: "Relative Strength Index"
    syntax: "$(timeframe).RSI().field"
    rating: 5
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "RSI值"
        readonly: true
      - name: "overbought"
        type: "boolean"
        description: "是否超买"
        readonly: true
      - name: "oversold"
        type: "boolean"
        description: "是否超卖"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true
      - name: "momentum"
        type: "double"
        description: "动量强度"
        readonly: true

  # 指标 3: EMA
  - id: "EMA"
    name: "指数移动平均线"
    category: "trend"
    description: "Exponential Moving Average"
    syntax: "$(timeframe).EMA().field"
    rating: 5
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 20
        min: 5
        max: 200
    fields:
      - name: "value"
        type: "double"
        description: "EMA值"
        readonly: true
      - name: "slope"
        type: "double"
        description: "斜率"
        readonly: true
      - name: "distance"
        type: "double"
        description: "与当前价格的距离百分比"
        readonly: true

  # 指标 4: MA
  - id: "MA"
    name: "简单移动平均线"
    category: "trend"
    description: "Simple Moving Average"
    syntax: "$(timeframe).MA().field"
    rating: 5
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 20
        min: 5
        max: 200
    fields:
      - name: "value"
        type: "double"
        description: "MA值"
        readonly: true
      - name: "slope"
        type: "double"
        description: "斜率"
        readonly: true
      - name: "distance"
        type: "double"
        description: "与当前价格的距离百分比"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 5: BOLL
  - id: "BOLL"
    name: "布林带"
    category: "volatility"
    description: "Bollinger Bands"
    syntax: "$(timeframe).BOLL().field"
    aliases: ["BBANDS"]
    rating: 5
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 20
        min: 5
        max: 100
      - name: "STD_DEV"
        type: "double"
        default: 2.0
        min: 1.0
        max: 5.0
    fields:
      - name: "upper"
        type: "double"
        description: "上轨"
        readonly: true
      - name: "middle"
        type: "double"
        description: "中轨"
        readonly: true
      - name: "lower"
        type: "double"
        description: "下轨"
        readonly: true
      - name: "width"
        type: "double"
        description: "带宽百分比"
        readonly: true
      - name: "percent_b"
        type: "double"
        description: "%B指标"
        readonly: true

  # 指标 6: ATR
  - id: "ATR"
    name: "平均真实波幅"
    category: "volatility"
    description: "Average True Range"
    syntax: "$(timeframe).ATR().field"
    rating: 5
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "ATR值"
        readonly: true
      - name: "volatility"
        type: "enum"
        enum_values: ["LOW", "MEDIUM", "HIGH"]
        description: "波动率等级"
        readonly: true

  # 指标 7: STOCHRSI
  - id: "STOCHRSI"
    name: "随机RSI"
    category: "momentum"
    description: "Stochastic RSI"
    syntax: "$(timeframe).STOCHRSI().field"
    rating: 4
    parameters:
      - name: "RSI_PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
      - name: "STOCH_PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
      - name: "K_PERIOD"
        type: "integer"
        default: 3
        min: 1
        max: 10
      - name: "D_PERIOD"
        type: "integer"
        default: 3
        min: 1
        max: 10
    fields:
      - name: "k"
        type: "double"
        description: "K线值"
        readonly: true
      - name: "d"
        type: "double"
        description: "D线值"
        readonly: true
      - name: "crossover_type"
        type: "enum"
        enum_values: ["GOLDEN_CROSS", "DEATH_CROSS", "NONE"]
        description: "交叉类型"
        readonly: true
      - name: "overbought"
        type: "boolean"
        description: "是否超买"
        readonly: true
      - name: "oversold"
        type: "boolean"
        description: "是否超卖"
        readonly: true

  # 指标 8: KDJ
  - id: "KDJ"
    name: "随机指标"
    category: "momentum"
    description: "KDJ Stochastic"
    syntax: "$(timeframe).KDJ().field"
    rating: 5
    parameters:
      - name: "FASTK_PERIOD"
        type: "integer"
        default: 9
        min: 3
        max: 20
      - name: "SLOWK_PERIOD"
        type: "integer"
        default: 3
        min: 1
        max: 10
      - name: "SLOWD_PERIOD"
        type: "integer"
        default: 3
        min: 1
        max: 10
    fields:
      - name: "k"
        type: "double"
        description: "K线值"
        readonly: true
      - name: "d"
        type: "double"
        description: "D线值"
        readonly: true
      - name: "j"
        type: "double"
        description: "J线值"
        readonly: true
      - name: "overbought"
        type: "boolean"
        description: "是否超买"
        readonly: true
      - name: "oversold"
        type: "boolean"
        description: "是否超卖"
        readonly: true

  # 指标 9: CCI
  - id: "CCI"
    name: "商品通道指标"
    category: "momentum"
    description: "Commodity Channel Index"
    syntax: "$(timeframe).CCI().field"
    rating: 4
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "CCI值"
        readonly: true
      - name: "overbought"
        type: "boolean"
        description: "是否超买"
        readonly: true
      - name: "oversold"
        type: "boolean"
        description: "是否超卖"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 10: ADX
  - id: "ADX"
    name: "平均趋向指标"
    category: "momentum"
    description: "Average Directional Index"
    syntax: "$(timeframe).ADX().field"
    rating: 5
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "ADX值"
        readonly: true
      - name: "trend_strength"
        type: "enum"
        enum_values: ["WEAK", "MODERATE", "STRONG", "VERY_STRONG"]
        description: "趋势强度"
        readonly: true
  
  # 指标 11: WR
  - id: "WR"
    name: "威廉指标"
    category: "momentum"
    description: "Williams %R"
    syntax: "$(timeframe).WR().field"
    rating: 4
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "WR值"
        readonly: true
      - name: "overbought"
        type: "boolean"
        description: "是否超买"
        readonly: true
      - name: "oversold"
        type: "boolean"
        description: "是否超卖"
        readonly: true

  # 指标 12: MFI
  - id: "MFI"
    name: "资金流量指标"
    category: "momentum"
    description: "Money Flow Index"
    syntax: "$(timeframe).MFI().field"
    rating: 4
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "MFI值"
        readonly: true
      - name: "overbought"
        type: "boolean"
        description: "是否超买"
        readonly: true
      - name: "oversold"
        type: "boolean"
        description: "是否超卖"
        readonly: true

  # 指标 13: OBV
  - id: "OBV"
    name: "能量潮指标"
    category: "volume"
    description: "On Balance Volume"
    syntax: "$(timeframe).OBV().field"
    rating: 4
    parameters: []
    fields:
      - name: "value"
        type: "double"
        description: "OBV值"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true
      - name: "change"
        type: "double"
        description: "变化量"
        readonly: true

  # 指标 14: SAR
  - id: "SAR"
    name: "抛物线转向指标"
    category: "trend"
    description: "Parabolic SAR"
    syntax: "$(timeframe).SAR().field"
    rating: 4
    parameters:
      - name: "SAR_ACCELERATION"
        type: "double"
        default: 0.02
        min: 0.01
        max: 0.1
      - name: "SAR_MAXIMUM"
        type: "double"
        default: 0.2
        min: 0.1
        max: 0.5
    fields:
      - name: "value"
        type: "double"
        description: "SAR值"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH"]
        description: "趋势方向"
        readonly: true

  # 指标 15: WMA
  - id: "WMA"
    name: "加权移动平均线"
    category: "trend"
    description: "Weighted Moving Average"
    syntax: "$(timeframe).WMA().field"
    rating: 4
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 20
        min: 5
        max: 200
    fields:
      - name: "value"
        type: "double"
        description: "WMA值"
        readonly: true
      - name: "slope"
        type: "double"
        description: "斜率"
        readonly: true
      - name: "distance"
        type: "double"
        description: "与当前价格的距离百分比"
        readonly: true

  # 指标 16: ROC
  - id: "ROC"
    name: "变动率指标"
    category: "momentum"
    description: "Rate of Change"
    syntax: "$(timeframe).ROC().field"
    rating: 4
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 12
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "ROC值(百分比)"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 17: AROON
  - id: "AROON"
    name: "阿隆指标"
    category: "trend"
    description: "Aroon Indicator"
    syntax: "$(timeframe).AROON().field"
    rating: 4
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 25
        min: 5
        max: 100
    fields:
      - name: "aroon_up"
        type: "double"
        description: "Aroon上升线"
        readonly: true
      - name: "aroon_down"
        type: "double"
        description: "Aroon下降线"
        readonly: true
      - name: "oscillator"
        type: "double"
        description: "振荡器"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 18: TRIX
  - id: "TRIX"
    name: "三重指数平滑移动平均"
    category: "price"
    description: "Triple Exponential Average"
    syntax: "$(timeframe).TRIX().field"
    rating: 3
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 15
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "TRIX值(百分比)"
        readonly: true
      - name: "signal"
        type: "double"
        description: "信号线"
        readonly: true
      - name: "crossover_type"
        type: "enum"
        enum_values: ["GOLDEN_CROSS", "DEATH_CROSS", "NONE"]
        description: "交叉类型"
        readonly: true
      - name: "zero_cross"
        type: "boolean"
        description: "零轴穿越"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 19: DMI
  - id: "DMI"
    name: "趋向指标"
    category: "trend"
    description: "Directional Movement Index"
    syntax: "$(timeframe).DMI().field"
    rating: 4
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
    fields:
      - name: "plus_di"
        type: "double"
        description: "+DI"
        readonly: true
      - name: "minus_di"
        type: "double"
        description: "-DI"
        readonly: true
      - name: "adx"
        type: "double"
        description: "ADX"
        readonly: true
      - name: "crossover_type"
        type: "enum"
        enum_values: ["GOLDEN_CROSS", "DEATH_CROSS", "NONE"]
        description: "交叉类型"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true
      - name: "trend_strength"
        type: "enum"
        enum_values: ["WEAK", "MODERATE", "STRONG", "VERY_STRONG"]
        description: "趋势强度"
        readonly: true

  # 指标 20: CMO
  - id: "CMO"
    name: "钱德动量摆动指标"
    category: "momentum"
    description: "Chande Momentum Oscillator"
    syntax: "$(timeframe).CMO().field"
    rating: 3
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 14
        min: 5
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "CMO值"
        readonly: true
      - name: "overbought"
        type: "boolean"
        description: "是否超买"
        readonly: true
      - name: "oversold"
        type: "boolean"
        description: "是否超卖"
        readonly: true
      - name: "zero_cross"
        type: "boolean"
        description: "零轴穿越"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true
  
  # 指标 21: TEMA
  - id: "TEMA"
    name: "三重指数移动平均"
    category: "trend"
    description: "Triple Exponential Moving Average"
    syntax: "$(timeframe).TEMA().field"
    rating: 3
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 30
        min: 5
        max: 200
    fields:
      - name: "value"
        type: "double"
        description: "TEMA值"
        readonly: true
      - name: "slope"
        type: "double"
        description: "斜率"
        readonly: true
      - name: "distance"
        type: "double"
        description: "与当前价格的距离百分比"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 22: DEMA
  - id: "DEMA"
    name: "双重指数移动平均"
    category: "trend"
    description: "Double Exponential Moving Average"
    syntax: "$(timeframe).DEMA().field"
    rating: 3
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 30
        min: 5
        max: 200
    fields:
      - name: "value"
        type: "double"
        description: "DEMA值"
        readonly: true
      - name: "slope"
        type: "double"
        description: "斜率"
        readonly: true
      - name: "distance"
        type: "double"
        description: "与当前价格的距离百分比"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 23: KAMA
  - id: "KAMA"
    name: "Kaufman自适应移动平均"
    category: "trend"
    description: "Kaufman Adaptive Moving Average"
    syntax: "$(timeframe).KAMA().field"
    rating: 4
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 10
        min: 5
        max: 100
    fields:
      - name: "value"
        type: "double"
        description: "KAMA值"
        readonly: true
      - name: "slope"
        type: "double"
        description: "斜率"
        readonly: true
      - name: "distance"
        type: "double"
        description: "与当前价格的距离百分比"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 24: T3
  - id: "T3"
    name: "Triple Exponential Moving Average"
    category: "trend"
    description: "T3 (Tillson)"
    syntax: "$(timeframe).T3().field"
    rating: 3
    parameters:
      - name: "PERIOD"
        type: "integer"
        default: 5
        min: 2
        max: 50
    fields:
      - name: "value"
        type: "double"
        description: "T3值"
        readonly: true
      - name: "slope"
        type: "double"
        description: "斜率"
        readonly: true
      - name: "distance"
        type: "double"
        description: "与当前价格的距离百分比"
        readonly: true
      - name: "trend"
        type: "enum"
        enum_values: ["BULLISH", "BEARISH", "NEUTRAL"]
        description: "趋势方向"
        readonly: true

  # 指标 25: MAMA
  - id: "MAMA"
    name: "MESA自适应移动平均"
    category: "trend"
    description: "MESA Adaptive Moving Average"
    syntax: "$(timeframe).MAMA().field"
    rating: 3
    parameters:
      - name: "MAMA_FASTLIMIT"
        type: "double"
        default: 0.5
        min: 0.01
        max: 0.99
      - name: "MAMA_SLOWLIMIT"
        type: "double"
        default: 0.05
        min: 0.01
        max: 0.99
    fields:
      - name: "mama"
        type: "double"
