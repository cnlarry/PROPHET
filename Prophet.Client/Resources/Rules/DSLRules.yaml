          - name: "lookback"
            type: "integer"
            default: 0
        description: "当前趋势（1=上升，-1=下降，0=未知）"
      - name: "count"
        return_type: "integer"
        parameters:
          - name: "swing_left"
            type: "integer"
            default: 5
          - name: "swing_right"
            type: "integer"
            default: 5
          - name: "lookback"
            type: "integer"
            default: 0
        description: "统计CHoCH数量"
    examples:
      - "CHOCH(15m).bullish(5, 5)"
      - "CHOCH(5m).trend(5, 5)"
      - "CHOCH(5m).count(5, 5, 50)"

  # 29. 流动性区域检测
  - id: "LIQUIDITY"
    name: "流动性区域检测"
    category: "smc"
    description: "检测流动性区域（等高点、等低点）"
    syntax: "LIQUIDITY(timeframe).method(price_tolerance[, lookback])"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
    methods:
      - name: "buyside"
        return_type: "boolean"
        parameters:
          - name: "price_tolerance"
            type: "double"
            default: 0.5
          - name: "lookback"
            type: "integer"
            default: 0
        description: "是否存在买方流动性"
      - name: "sellside"
        return_type: "boolean"
        parameters:
          - name: "price_tolerance"
            type: "double"
            default: 0.5
          - name: "lookback"
            type: "integer"
            default: 0
        description: "是否存在卖方流动性"
      - name: "price"
        return_type: "double"
        parameters:
          - name: "price_tolerance"
            type: "double"
            default: 0.5
          - name: "lookback"
            type: "integer"
            default: 0
        description: "流动性价格水平"
      - name: "strength"
        return_type: "double"
        parameters:
          - name: "price_tolerance"
            type: "double"
            default: 0.5
          - name: "lookback"
            type: "integer"
            default: 0
        description: "流动性强度"
      - name: "swept"
        return_type: "boolean"
        parameters:
          - name: "price_tolerance"
            type: "double"
            default: 0.5
          - name: "lookback"
            type: "integer"
            default: 0
        description: "是否被扫荡"
      - name: "distance"
        return_type: "double"
        parameters:
          - name: "price_tolerance"
            type: "double"
            default: 0.5
          - name: "lookback"
            type: "integer"
            default: 0
        description: "距离流动性的百分比"
      - name: "count"
        return_type: "integer"
        parameters:
          - name: "price_tolerance"
            type: "double"
            default: 0.5
          - name: "lookback"
            type: "integer"
            default: 0
        description: "统计流动性区域数量"
    examples:
      - "LIQUIDITY(5m).buyside(0.5)"
      - "LIQUIDITY(5m).swept(0.5, 0)"
      - "LIQUIDITY(15m).distance(0.5)"

  # 30. 突破块检测
  - id: "BREAKER"
    name: "突破块检测"
    category: "smc"
    description: "检测Breaker Block（突破块）"
    syntax: "BREAKER(timeframe).method([lookback])"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
    methods:
      - name: "bullish"
        return_type: "boolean"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "是否存在看涨突破块"
      - name: "bearish"
        return_type: "boolean"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "是否存在看跌突破块"
      - name: "top"
        return_type: "double"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "突破块上边界"
      - name: "bottom"
        return_type: "double"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "突破块下边界"
      - name: "mid"
        return_type: "double"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "突破块中间价"
      - name: "strength"
        return_type: "double"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "突破块强度"
      - name: "tested"
        return_type: "boolean"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "是否被测试过"
      - name: "testcount"
        return_type: "integer"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "测试次数"
      - name: "broken"
        return_type: "boolean"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "是否失效"
      - name: "count"
        return_type: "integer"
        parameters:
          - name: "lookback"
            type: "integer"
            default: 0
        description: "统计突破块数量"
    examples:
      - "BREAKER(5m).bullish()"
      - "BREAKER(5m).bottom(0)"
      - "BREAKER(15m).testcount(0)"

# =============================================================================
# 数学运算函数定义
# 参考文档: Prophet DSL 数学运算函数.md
# 特点: 不需要timeframe参数，使用标准函数调用语法
# =============================================================================
math_functions:
  # =========================================================================
  # 基础运算函数（6个）
  # =========================================================================
  
  # 1. ABS - 绝对值
  - id: "ABS"
    name: "绝对值"
    category: "basic"
    description: "返回数值的绝对值"
    syntax: "ABS(x)"
    parameters:
      - name: "x"
        type: "double"
        required: true
        description: "任意实数"
    return_type: "double"
    use_cases:
      - "计算价差幅度（不考虑方向）"
      - "指标偏离度计算"
      - "距离测量"
      - "误差计算"
    examples:
      - "ABS(-5.5)  // 返回 5.5"
      - "ABS($(5m).MACD().histogram)  // MACD柱状图的绝对值"
      - "ABS(KLINE(5m).close(0) - KLINE(5m).open(0))  // 实体大小"
  
  # 2. ROUND - 四舍五入
  - id: "ROUND"
    name: "四舍五入"
    category: "basic"
    description: "将数值四舍五入到指定小数位数"
    syntax: "ROUND(value, precision)"
    parameters:
      - name: "value"
        type: "double"
        required: true
        description: "要处理的数值"
      - name: "precision"
        type: "integer"
        required: true
        min: 0
        description: "保留的小数位数"
    return_type: "double"
    use_cases:
      - "数值显示格式化"
      - "价格精度处理"
      - "百分比展示"
      - "减少浮点误差"
    examples:
      - "ROUND(3.14159, 2)  // 返回 3.14"
      - "ROUND($(5m).RSI().value, 0)  // RSI值取整"
      - "ROUND(KLINE(5m).close(0), 2)  // 价格保留2位小数"
  
  # 3. CEIL - 向上取整
  - id: "CEIL"
    name: "向上取整"
    category: "basic"
    description: "返回大于或等于给定数值的最小整数"
    syntax: "CEIL(x)"
    parameters:
      - name: "x"
        type: "double"
        required: true
        description: "任意实数"
    return_type: "integer"
    use_cases:
      - "周期参数取整"
      - "数量向上取整"
      - "价格档位调整"
    examples:
      - "CEIL(3.14)  // 返回 4"
      - "CEIL(-2.5)  // 返回 -2"
      - "CEIL(HT(5m).DCPERIOD)  // 周期向上取整"
  
  # 4. FLOOR - 向下取整
  - id: "FLOOR"
    name: "向下取整"
    category: "basic"
    description: "返回小于或等于给定数值的最大整数"
    syntax: "FLOOR(x)"
    parameters:
      - name: "x"
        type: "double"
        required: true
        description: "任意实数"
    return_type: "integer"
    use_cases:
      - "周期参数取整"
      - "数量向下取整"
      - "保守估算"
    examples:
      - "FLOOR(3.9)  // 返回 3"
      - "FLOOR(-2.5)  // 返回 -3"
      - "FLOOR(HT(5m).DCPERIOD)  // 周期向下取整"
  
  # 5. SQRT - 平方根
  - id: "SQRT"
    name: "平方根"
    category: "basic"
    description: "返回数值的平方根"
    syntax: "SQRT(x)"
    parameters:
      - name: "x"
        type: "double"
        required: true
        min: 0.0
        description: "非负实数（x ≥ 0）"
    return_type: "double"
    validation: "如果 x < 0，将抛出异常"
    use_cases:
      - "标准差计算"
      - "距离计算（欧几里得距离）"
      - "波动率归一化"
      - "数学模型构建"
    examples:
      - "SQRT(16)  // 返回 4"
      - "SQRT(VARIANCE(5m).close(20))  // 标准差计算"
      - "SQRT($(5m).ATR().value)  // ATR平方根"
  
  # 6. POW - 幂运算
  - id: "POW"
    name: "幂运算"
    category: "basic"
    description: "返回底数的指数次幂"
    syntax: "POW(base, exponent)"
    parameters:
      - name: "base"
        type: "double"
        required: true
        description: "底数"
      - name: "exponent"
        type: "double"
        required: true
        description: "指数"
    return_type: "double"
    use_cases:
      - "平方/立方计算"
      - "指数加权"
      - "方差计算"
      - "复利计算"
      - "数学模型"
    examples:
      - "POW(2, 3)  // 返回 8 (2³)"
      - "POW(4, 0.5)  // 返回 2 (平方根)"
      - "POW(KLINE(5m).close(0), 2)  // 收盘价的平方"
  
  # =========================================================================
  # 三角函数（6个）
  # 注意：所有三角函数使用弧度制，不是角度制！
  # =========================================================================
  
  # 7. SIN - 正弦
  - id: "SIN"
    name: "正弦"
    category: "trigonometric"
    description: "返回角度的正弦值"
    syntax: "SIN(angle)"
    parameters:
      - name: "angle"
        type: "double"
        required: true
        description: "弧度值"
    return_type: "double"
    value_range: "[-1, 1]"
    note: "使用弧度制，角度需转换：radians = degrees * π / 180"
    examples:
      - "SIN(0)  // 返回 0"
      - "SIN(3.14159 / 2)  // 返回 1 (π/2)"
  
  # 8. COS - 余弦
  - id: "COS"
    name: "余弦"
    category: "trigonometric"
    description: "返回角度的余弦值"
    syntax: "COS(angle)"
    parameters:
      - name: "angle"
        type: "double"
        required: true
        description: "弧度值"
    return_type: "double"
    value_range: "[-1, 1]"
    note: "使用弧度制"
    examples:
      - "COS(0)  // 返回 1"
      - "COS(3.14159)  // 返回 -1 (π)"
  
  # 9. TAN - 正切
  - id: "TAN"
    name: "正切"
    category: "trigonometric"
    description: "返回角度的正切值"
    syntax: "TAN(angle)"
    parameters:
      - name: "angle"
        type: "double"
        required: true
        description: "弧度值"
    return_type: "double"
    note: "使用弧度制，在 ±π/2 处不连续"
    examples:
      - "TAN(0)  // 返回 0"
      - "TAN(3.14159 / 4)  // 返回 1 (π/4, 即45度)"
  
  # 10. ASIN - 反正弦
  - id: "ASIN"
    name: "反正弦"
    category: "trigonometric"
    description: "返回正弦值对应的角度"
    syntax: "ASIN(value)"
    parameters:
      - name: "value"
        type: "double"
        required: true
        min: -1.0
        max: 1.0
        description: "必须在 [-1, 1] 范围内"
    return_type: "double"
    value_range: "[-π/2, π/2] 弧度"
    validation: "如果 value 不在 [-1, 1]，将抛出异常"
    examples:
      - "ASIN(0)  // 返回 0"
      - "ASIN(1)  // 返回 π/2"
      - "ASIN(0.5)  // 返回 π/6 (30度)"
  
  # 11. ACOS - 反余弦
  - id: "ACOS"
    name: "反余弦"
    category: "trigonometric"
    description: "返回余弦值对应的角度"
    syntax: "ACOS(value)"
    parameters:
      - name: "value"
        type: "double"
        required: true
        min: -1.0
        max: 1.0
        description: "必须在 [-1, 1] 范围内"
    return_type: "double"
    value_range: "[0, π] 弧度"
    validation: "如果 value 不在 [-1, 1]，将抛出异常"
    examples:
      - "ACOS(0)  // 返回 π/2"
      - "ACOS(1)  // 返回 0"
      - "ACOS(-1)  // 返回 π"
  
  # 12. ATAN - 反正切
  - id: "ATAN"
    name: "反正切"
    category: "trigonometric"
    description: "返回正切值对应的角度"
    syntax: "ATAN(value)"
    parameters:
      - name: "value"
        type: "double"
        required: true
        description: "任意实数"
    return_type: "double"
    value_range: "(-π/2, π/2) 弧度"
    use_cases:
      - "斜率转角度"
      - "趋势角度计算"
    examples:
      - "ATAN(0)  // 返回 0"
      - "ATAN(1)  // 返回 π/4 (45度)"
      - "ATAN(SLOPE(5m).close(20))  // 斜率转角度"
  
  # =========================================================================
  # 双曲函数（3个）
  # =========================================================================
  
  # 13. SINH - 双曲正弦
  - id: "SINH"
    name: "双曲正弦"
    category: "hyperbolic"
    description: "返回双曲正弦值"
    syntax: "SINH(x)"
    formula: "SINH(x) = (e^x - e^(-x)) / 2"
    parameters:
      - name: "x"
        type: "double"
        required: true
        description: "任意实数"
    return_type: "double"
    examples:
      - "SINH(0)  // 返回 0"
      - "SINH(1)  // 返回 1.175..."
  
  # 14. COSH - 双曲余弦
  - id: "COSH"
    name: "双曲余弦"
    category: "hyperbolic"
    description: "返回双曲余弦值"
    syntax: "COSH(x)"
    formula: "COSH(x) = (e^x + e^(-x)) / 2"
    parameters:
      - name: "x"
        type: "double"
        required: true
        description: "任意实数"
    return_type: "double"
    examples:
      - "COSH(0)  // 返回 1"
      - "COSH(1)  // 返回 1.543..."
  
  # 15. TANH - 双曲正切
  - id: "TANH"
    name: "双曲正切"
    category: "hyperbolic"
    description: "返回双曲正切值"
    syntax: "TANH(x)"
    formula: "TANH(x) = SINH(x) / COSH(x)"
    parameters:
      - name: "x"
        type: "double"
        required: true
        description: "任意实数"
    return_type: "double"
    value_range: "(-1, 1)"
    use_cases:
      - "数值归一化（类似Sigmoid）"
      - "机器学习激活函数"
      - "平滑函数"
    examples:
      - "TANH(0)  // 返回 0"
      - "TANH(1)  // 返回 0.762..."
      - "TANH(($(5m).RSI().value - 50) / 50)  // RSI归一化"
  
  # =========================================================================
  # 指数和对数函数（3个）
  # =========================================================================
  
  # 16. EXP - 自然指数
  - id: "EXP"
    name: "自然指数"
    category: "exponential"
    description: "返回 e^x，其中 e ≈ 2.71828"
    syntax: "EXP(x)"
    parameters:
      - name: "x"
        type: "double"
        required: true
        description: "指数值"
    return_type: "double"
    value_range: "(0, +∞)"
    note: "x 通常应在 [-20, 20] 范围，避免溢出"
    use_cases:
      - "指数增长/衰减模型"
      - "正态分布计算"
      - "指数移动平均权重"
      - "复利计算"
    examples:
      - "EXP(0)  // 返回 1"
      - "EXP(1)  // 返回 2.71828... (自然常数e)"
      - "EXP(-0.1)  // 指数衰减因子"
  
  # 17. LN - 自然对数
  - id: "LN"
    name: "自然对数"
    category: "exponential"
    description: "返回 x 的自然对数（以 e 为底）"
    syntax: "LN(x)"
    parameters:
      - name: "x"
        type: "double"
        required: true
        min: 0.0
        exclusive_min: true
        description: "x 必须大于 0"
    return_type: "double"
    validation: "如果 x ≤ 0，将抛出异常"
    use_cases:
      - "对数收益率计算"
      - "增长率分析"
      - "幂律分布"
      - "信息熵计算"
    examples:
      - "LN(1)  // 返回 0"
      - "LN(2.71828)  // 返回 1"
      - "LN(KLINE(5m).close(0) / KLINE(5m).close(10))  // 对数收益率"
  
  # 18. LOG10 - 常用对数
  - id: "LOG10"
    name: "常用对数"
    category: "exponential"
    description: "返回 x 的常用对数（以 10 为底）"
    syntax: "LOG10(x)"
    parameters:
      - name: "x"
        type: "double"
        required: true
        min: 0.0
        exclusive_min: true
        description: "x 必须大于 0"
    return_type: "double"
    validation: "如果 x ≤ 0，将抛出异常"
    use_cases:
      - "数量级判断"
      - "对数刻度绘图"
      - "科学计数法"
      - "范围压缩"
    examples:
      - "LOG10(1)  // 返回 0"
      - "LOG10(10)  // 返回 1"
      - "LOG10(100)  // 返回 2"
      - "FLOOR(LOG10(KLINE(5m).close(0)))  // 价格数量级"

# =============================================================================
# 信号函数定义（8个）
# 参考文档: Prophet DSL 信号函数.md
# =============================================================================
signal_functions:
  # 1. ALL - 全部满足
  - id: "ALL"
    name: "全部满足"
    category: "basic_logic"
    description: "所有条件都必须满足时才触发信号"
    syntax: "ALL { conditions } = SIGNAL_TYPE"
    return_type: "signal"
    strictness: 5  # 最严格
    flexibility: 1  # 灵活性低
    use_cases:
      - "高确定性策略"
      - "保守型交易"
      - "多维度验证"
    examples:
      - |
        ALL {
          $(1h).MACD().trend == BULLISH,
          $(1h).RSI().value > 50,
          $(1h).OBV().trend == BULLISH
        } = BUY;
      - |
        ALL {
          $(5m).MA().trend == BULLISH,
          $(15m).MA().trend == BULLISH,
          $(1h).MA().trend == BULLISH
        } = BUY;
  
  # 2. ANY - 任一满足
  - id: "ANY"
    name: "任一满足"
    category: "basic_logic"
    description: "任意一个条件满足时就触发信号"
    syntax: "ANY { conditions } = SIGNAL_TYPE"
    return_type: "signal"
    strictness: 1  # 最宽松
    flexibility: 5  # 灵活性高
    use_cases:
      - "积极型交易"
      - "多机会捕获"
      - "止损/止盈触发"
    examples:
      - |
        ANY {
          $(1h).RSI().value > 70,
          $(1h).STOCHRSI().overbought = true,
          $(1h).MFI().value > 80
        } = SELL;
      - |
        ANY {
          $(1h).MACD().crossover_type == GOLDEN_CROSS,
          $(1h).KDJ().k > $(1h).KDJ().d,
          $(1h).MA().trend == BULLISH
        } = BUY;
  
  # 3. NONE - 全部不满足
  - id: "NONE"
    name: "全部不满足"
    category: "basic_logic"
    description: "所有条件都不满足时才触发信号"
    syntax: "NONE { conditions } = SIGNAL_TYPE"
    return_type: "signal"
    strictness: 5  # 严格
    flexibility: 2  # 灵活性较低
    use_cases:
      - "风险过滤"
      - "反向确认"
      - "市场状态排除"
    examples:
      - |
        NONE {
          $(1h).RSI().value > 70,
          $(1h).STOCHRSI().overbought = true,
          $(1h).MFI().value > 80
        } = BUY;
      - |
        NONE {
          $(1h).MACD().trend == BEARISH,
          $(1h).RSI().value < 30,
          $(1h).ADX().value < 20
        } = HOLD;
  
  # 4. MIN - 最少满足
  - id: "MIN"
    name: "最少满足"
    category: "quantity_control"
    description: "至少满足N个条件时触发信号"
    syntax: "MIN(n) { conditions } = SIGNAL_TYPE"
    parameters:
      - name: "n"
        type: "integer"
        required: true
        min: 1
        description: "最少需要满足的条件数量"
    return_type: "signal"
    strictness: 3  # 中等
    flexibility: 3  # 中等
    use_cases:
      - "平衡型策略"
      - "多维度弱确认"
      - "降低ALL的严格性"
    examples:
      - |
        MIN(2) {
          $(1h).MACD().trend == BULLISH,
          $(1h).RSI().value > 50,
          $(1h).ADX().value > 25,
          $(1h).OBV().trend == BULLISH
        } = BUY;
      - |
        MIN(2) {
          $(5m).MA().trend == BULLISH,
          $(15m).MA().trend == BULLISH,
          $(1h).MA().trend == BULLISH,
          $(4h).MA().trend == BULLISH
        } = BUY;
  
  # 5. COUNT - 恰好满足
  - id: "COUNT"
    name: "恰好满足"
    category: "quantity_control"
    description: "恰好满足N个条件时触发信号"
    syntax: "COUNT(n) { conditions } = SIGNAL_TYPE"
    parameters:
      - name: "n"
        type: "integer"
        required: true
        min: 1
        description: "需要恰好满足的条件数量"
    return_type: "signal"
    strictness: 5  # 非常严格
    flexibility: 1  # 灵活性极低
    use_cases:
      - "特殊模式识别"
      - "精确条件匹配"
    note: "使用较少，建议优先使用MIN或VOTE"
    examples:
      - |
        COUNT(2) {
          $(1h).MACD().trend == BULLISH,
          $(1h).RSI().value > 50,
          $(1h).ADX().value > 25
        } = BUY;
  
  # 6. MAX - 最多满足
  - id: "MAX"
    name: "最多满足"
    category: "quantity_control"
    description: "最多满足N个条件时触发信号"
    syntax: "MAX(n) { conditions } = SIGNAL_TYPE"
    parameters:
      - name: "n"
        type: "integer"
        required: true
        min: 0
        description: "最多允许满足的条件数量"
    return_type: "signal"
    strictness: 3  # 中等
    flexibility: 2  # 灵活性较低
    use_cases:
      - "风险控制"
      - "避免市场过热"
      - "反向确认"
    examples:
      - |
        MAX(1) {
          $(1h).RSI().value > 70,
          $(1h).STOCHRSI().overbought = true,
          $(1h).MFI().value > 80
        } = BUY;
  
  # 7. VOTE - 投票机制（推荐）
  - id: "VOTE"
    name: "投票机制"
    category: "quantity_control"
    description: "支持两种模式的投票机制，适合民主决策"
    syntax: "VOTE(threshold) { conditions } = SIGNAL_TYPE"
    parameters:
      - name: "threshold"
        type: "number"
        required: true
        description: "投票阈值：>1为整数模式（至少N个），0<threshold<=1为百分比模式（至少x%）"
    return_type: "signal"
    strictness: 3  # 中等
    flexibility: 5  # 灵活性最高
    recommended: true
    use_cases:
      - "多指标综合决策（推荐百分比模式）"
      - "多时间框架共振"
      - "策略模块化"
      - "动态策略"
    modes:
      - name: "integer_mode"
        description: "整数模式（threshold > 1）：至少满足N个条件"
        example: "VOTE(3) { ... }  // 至少3个条件满足"
      - name: "percentage_mode"
        description: "百分比模式（0 < threshold <= 1）：至少满足x%的条件"
        example: "VOTE(0.6) { ... }  // 至少60%的条件满足"
        recommended: true
    advantages:
      - "灵活性最高 - 支持数量和百分比两种模式"
      - "语义清晰 - '投票'概念直观易懂"
      - "扩展性强 - 动态添加条件无需修改阈值（百分比模式）"
    examples:
      - |
        // 整数模式：至少3个指标看涨
        VOTE(3) {
          $(1h).MACD().trend == BULLISH,
          $(1h).RSI().value > 50,
          $(1h).ADX().value > 25,
          $(1h).OBV().trend == BULLISH,
          $(1h).MA().trend == BULLISH
        } = BUY;
      - |
        // 百分比模式：至少60%的指标看涨（推荐）
        VOTE(0.6) {
          $(1h).MACD().trend == BULLISH,
          $(1h).RSI().value > 50,
          $(1h).ADX().value > 25,
          $(1h).OBV().trend == BULLISH,
          $(1h).MA().trend == BULLISH
        } = BUY;
      - |
        // 多时间框架投票
        VOTE(0.6) {
          $(1m).RSI().value > 50,
          $(5m).RSI().value > 50,
          $(15m).RSI().value > 50,
          $(30m).RSI().value > 50,
          $(1h).RSI().value > 50
        } = BUY;
  
  # 8. WEIGHTED - 加权评分
  - id: "WEIGHTED"
    name: "加权评分"
    category: "weighted_scoring"
    description: "为不同条件分配权重，根据总分触发信号"
    syntax: "WEIGHTED(threshold) { WEIGHT(condition) = weight; ... } = SIGNAL_TYPE"
    parameters:
      - name: "threshold"
        type: "double"
        required: true
        min: 0.0
        max: 1.0
        description: "触发阈值（0.0-1.0）"
    return_type: "signal"
    strictness: 3  # 中等
    flexibility: 5  # 灵活性高
    complexity: "high"
    use_cases:
      - "复杂量化策略"
      - "多因子模型"
      - "信号强度评估"
      - "条件重要性差异大"
    weight_design_principles:
      - "总权重可超过1.0 - 满分越高，触发难度越大"
      - "核心条件高权重 - 最重要的条件分配30%-50%权重"
      - "辅助条件低权重 - 次要条件分配10%-20%权重"
      - "权重平衡 - 避免单一条件主导决策"
    examples:
      - |
        // 基础加权评分
        WEIGHTED(0.6) {
          WEIGHT($(5m).MACD().crossover_type == GOLDEN_CROSS) = 0.4;
          WEIGHT($(5m).RSI().value < 50) = 0.2;
          WEIGHT($(1h).MACD().trend == BULLISH) = 0.3;
          WEIGHT($(5m).EMA().trend == BULLISH) = 0.3;
        } = BUY;
      - |
        // 多维度加权（趋势50%、动量30%、成交量20%）
        WEIGHTED(0.7) {
          // 趋势类（50%权重）
          WEIGHT($(1h).MACD().trend == BULLISH) = 0.3;
          WEIGHT($(1h).MA().trend == BULLISH) = 0.2;
          
          // 动量类（30%权重）
          WEIGHT($(1h).RSI().value > 50) = 0.15;
          WEIGHT($(1h).STOCHRSI().k > $(1h).STOCHRSI().d) = 0.15;
          
          // 成交量类（20%权重）
          WEIGHT($(1h).OBV().trend == BULLISH) = 0.1;
          WEIGHT($(1h).MFI().value > 50) = 0.1;
        } = BUY;
      - |
        // 多条件共享权重（AND逻辑）
        WEIGHTED(0.6) {
          WEIGHT(
            $(5m).MACD().crossover_type == GOLDEN_CROSS,
            $(5m).EMA().trend == BULLISH,
            $(5m).RSI().value < 30
          ) = 0.4;
          
          WEIGHT($(1h).MACD().trend == BULLISH) = 0.3;
          WEIGHT($(1h).ADX().value > 25) = 0.3;
        } = BUY;

