  # 12. 线性回归斜率
  - id: "SLOPE"
    name: "线性回归斜率"
    category: "statistics"
    description: "计算指定周期内数据的线性回归斜率"
    syntax: "SLOPE(timeframe).field(period)"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
      - name: "field"
        type: "enum"
        enum_values: ["open", "high", "low", "close", "volume"]
        required: true
      - name: "period"
        type: "integer"
        required: true
        min: 2
        max: 100
    return_type: "double"
    examples:
      - "SLOPE(5m).close(20)"

  # 13. 标准化得分
  - id: "ZSCORE"
    name: "标准化得分"
    category: "statistics"
    description: "计算当前值相对于历史均值的标准化得分"
    syntax: "ZSCORE(timeframe).field(period)"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
      - name: "field"
        type: "enum"
        enum_values: ["open", "high", "low", "close", "volume"]
        required: true
      - name: "period"
        type: "integer"
        required: true
        min: 2
        max: 100
    return_type: "double"
    examples:
      - "ZSCORE(5m).close(50)"

  # 14. 百分位数
  - id: "PERCENTILE"
    name: "百分位数"
    category: "statistics"
    description: "计算指定百分位数的值"
    syntax: "PERCENTILE(timeframe).field(period, quantile)"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
      - name: "field"
        type: "enum"
        enum_values: ["open", "high", "low", "close", "volume"]
        required: true
      - name: "period"
        type: "integer"
        required: true
        min: 1
        max: 100
      - name: "quantile"
        type: "double"
        required: true
        min: 0.0
        max: 1.0
    return_type: "double"
    examples:
      - "PERCENTILE(5m).high(100, 0.95)"
      - "PERCENTILE(5m).low(100, 0.05)"

  # 15. 交叉检测
  - id: "CROSS"
    name: "交叉检测"
    category: "statistics"
    description: "检测数值是否穿越阈值"
    syntax: "CROSS(timeframe).method(threshold).subfield"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
    methods:
      - name: "open"
        return_type: "object"
        parameters:
          - name: "threshold"
            type: "double"
            required: true
        subfields:
          - name: "above"
            type: "boolean"
            description: "向上穿越"
          - name: "below"
            type: "boolean"
            description: "向下穿越"
          - name: "any"
            type: "boolean"
            description: "任意穿越"
      - name: "high"
        return_type: "object"
        parameters:
          - name: "threshold"
            type: "double"
            required: true
        subfields:
          - name: "above"
            type: "boolean"
            description: "向上穿越"
          - name: "below"
            type: "boolean"
            description: "向下穿越"
          - name: "any"
            type: "boolean"
            description: "任意穿越"
      - name: "low"
        return_type: "object"
        parameters:
          - name: "threshold"
            type: "double"
            required: true
        subfields:
