# =============================================================================
# 数据函数定义
# 规则：
#   - methods/submethods：需要括号 ()，即使无参数
#   - fields/subfields：不需要括号，直接访问
# 五种标准形式：
#   1. Func(tf).method()           - 方法
#   2. Func(tf).method().subfield  - 方法 + 子字段
#   3. Func(tf).method().submethod() - 方法 + 子方法
#   4. Func(tf).field              - 字段
#   5. Func(tf).field.subfield     - 字段 + 子字段
# =============================================================================
data_functions:
  # 1. K线数据访问
  - id: "KLINE"
    name: "K线数据访问"
    category: "data_access"
    description: "获取K线数据"
    syntax: "KLINE(timeframe).field(offset)"
    parameters:
      - name: "timeframe"
        type: "timeframe"
        required: true
        description: "时间框架"
    methods:
      - name: "open"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
            description: "偏移量，0表示当前K线"
        description: "获取开盘价"
      - name: "high"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "获取最高价"
      - name: "low"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "获取最低价"
      - name: "close"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "获取收盘价"
      - name: "volume"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "获取成交量"

  # 2. 综合价格计算
  - id: "PRICE"
    name: "综合价格计算"
    category: "data_access"
    description: "提供多种价格计算方法"
    syntax: "PRICE(timeframe).method([offset])"
    parameters:
      - name: "timeframe"
        type: "string"
        required: true
    methods:
      - name: "AVG"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "平均价格 (High + Low + Close) / 3"
      - name: "MED"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "中位价 (High + Low) / 2"
      - name: "TYP"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "典型价 (High + Low + Close) / 3"
      - name: "WCL"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "加权收盘价 (High + Low + Close * 2) / 4"
      - name: "MID"
        return_type: "double"
        parameters:
          - name: "offset"
            type: "integer"
            default: 0
            min: -100
            max: 0
        description: "中点价 (High + Low) / 2"
    examples:
      - "PRICE(5m).AVG()"
      - "PRICE(5m).TYP(1)"
      - "PRICE(1h).WCL(0)"

  # 3. 最高值
  - id: "HIGHEST"
    name: "最高值"
    category: "statistics"
    description: "返回指定周期内的最大值"
    syntax: "HIGHEST(timeframe).field(period)"
    parameters:
      - name: "timeframe"
